[package]
name = "shellglass-wt-tap"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Independent project kept beside the shellglass checkout during development.
# Replace the sibling path dependency with a pinned git revision after the
# reusable API is upstream.
[workspace]

[features]
default = ["serve", "push", "accessibility"]
serve = ["shellglass/serve-api"]
push = ["shellglass/push-api"]
accessibility = [
    "dep:crossterm",
    "dep:serde",
    "dep:serde_json",
    "dep:toml",
    "dep:unicode-segmentation",
    "dep:unicode-width",
    "dep:xa11y",
]

[dependencies]
anyhow = "1.0.103"
bytes = "1"
clap = { version = "4.6.1", features = ["derive", "env"] }
crossterm = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
shellglass = { path = "../shellglass", default-features = false }
toml = { version = "1", optional = true }
tokio = { version = "1.52.3", features = ["full"] }
unicode-segmentation = { version = "1", optional = true }
unicode-width = { version = "0.2", optional = true }
xa11y = { path = "../xa11y/xa11y", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
